// TJ frames are baked at native art resolution (1 art px = 1 canvas px at the normal 2x view).
// Pairs (bare, wrench-in-hand): 0/1 idle, 2/3 walk A, 4/5 walk passing, 6/7 walk B / air stride.
// Anchor: body centre (col 11) on the hitbox centre, soles on the hitbox bottom; drawn only at whole-pixel scales so no row/column is ever doubled unevenly.
const TJ_AX=11;
const TJ_PX=1; // screen px per art px at the normal 2x view: 1 = 14.5-unit TJ (matches the 10x14 hitbox), 2 = 29 units (double size)
function TJ(x,y,f,air,run,an,hand){
 const h=hand?1:0;
 const cyc=[2,4,6,4];
 const pose=air?6+h:(run?cyc[Math.floor(sT/6)%4]+h:h);
 const im=TJSPR[pose];if(!im||!im.complete||!im.naturalWidth)return;
 const t=X.getTransform(),k=Math.max(1,Math.floor(t.a*.5*TJ_PX+1e-6));
 const w=im.naturalWidth,ht=im.naturalHeight;
 const cx=Math.round(t.a*(x+5)+t.e),by=Math.round(t.d*(y+14)+t.f);
 X.save();X.setTransform(1,0,0,1,0,0);X.imageSmoothingEnabled=false;
 if(f<=0){X.translate(cx,0);X.scale(-1,1);X.translate(-cx,0)}
 X.drawImage(im,cx-TJ_AX*k,by-ht*k,w*k,ht*k);X.restore();
}

function mkS(N,build,flip){
 const A=new Array(N*N).fill(null),INK='#14121f';

 const ell=(cx,cy,rx,ry,c,rim=1,sh=1)=>{for(let y=Math.max(0,Math.floor(cy-ry)-1);y<=Math.min(N-1,Math.ceil(cy+ry)+1);y++)for(let x=Math.max(0,Math.floor(cx-rx)-1);x<=Math.min(N-1,Math.ceil(cx+rx)+1);x++){

  if(rim&&!(inE(x+1,y,cx,cy,rx,ry)&&inE(x-1,y,cx,cy,rx,ry)&&inE(x,y+1,cx,cy,rx,ry)&&inE(x,y-1,cx,cy,rx,ry)))q=mix(c,-.4);

 const has=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&A[y*N+x];

  else if(c=='o'){L.it.push({k:'o',x:x*16+4,y:y*16+4,w:8,h:8,vx:0,vy:0});L.tb++;g[y][x]='.'}

E('c_bots','char','ROBOT WORKFORCE','CHARACTER - FACTORY STAFF',['e','r'],['STATUS: ON THE CLOCK','SHIFT: ALWAYS','UNION: NONE'],
 `The machines that run the factory. Nobody can say who built them or why there are so many, and TJ still can't tell whether the rumor is true or they're just very good at their jobs. Most follow simple patrol programs, which is a polite way of saying they aren't very bright. They don't seem to hate TJ. They just treat him like a spill that needs cleaning up.`),
E('c_bono','char','BONOBOMB','CHARACTER - SECURITY GUARD',['bono'],['MODEL: PERIMETER GUARD','BUILD: BONOBO','SKILL: EXPLOSIVES'],
 `A nimble security guard bonobo who patrols the grounds outside the factory. Bonobomb is the fastest guard TJ will meet, and he carries far more explosives than any guard strictly needs. Nobody told him why a monkey is wandering around out here, only that the detour is closed. He takes the job personally.`),
E('c_bernie','char','BERNIE ZEE','CHARACTER - THE BLACKSMITH',['bernie'],['SPECIES: CHIMPANZEE','JOB: BLACKSMITH','SKILL: FORGING'],
 `The factory's master blacksmith, who keeps the boiler fed with a shovel, a hammer and a very short temper. Bernie Zee hand-forges everything the robots are built from, and he does not like visitors tramping through his basement. He needs fresh coal to work, and the two furnaces on either side of his forge are the only place he can get it.`),
/* ---- ENEMIES ---- */
E('e_walk','enemy','WALKER','ENEMY - PATROL ROBOT',['e','r'],['HEALTH: 1 HIT','STOMP: YES','FIRST SEEN: 1-1'],
 `A basic patrol robot. Walkers trudge back and forth along their stretch of floor and turn around at ledges and walls. They have one job, one speed and one expression. Most workers meet a Walker within minutes of arriving, usually by bumping into it.`,
 `Jump on its head or hit it with the wrench.`),
E('e_spike','enemy','SPIKER','ENEMY - ARMORED PATROL',['e','s'],['HEALTH: 2 HITS','STOMP: NO (SPIKES)','FIRST SEEN: 1-1'],
 `A slow orange walker with a crown of spikes bolted to its head. It patrols like a Walker but is far tougher, and landing on it hurts you instead of it. Spikers move slowly, but nothing about them is gentle.`,
 `Use the wrench. Two hits takes one out.`),
E('e_jump','enemy','JUMPER','ENEMY - SPRING BOT',['e','j'],['HEALTH: 1 HIT','STOMP: YES','FIRST SEEN: 1-1'],
 `A purple spring-loaded bot that squashes down, waits, then leaps toward you. It never wanders and never chases. It just sits there until you get close, and then it pounces. The pause before each hop is its only tell.`,
 `Watch it squash down, then jump over it or hit it in mid-air.`),
E('e_drone','enemy','DRONE','ENEMY - FLYING BOT',['e','d'],['HEALTH: 1 HIT','STOMP: YES','FIRST SEEN: 1-1'],
 `A small hovering bot that bobs up and down as it drifts back and forth. Drones ignore the floor entirely, so they float over pits and patrol platforms from above. They aren't fast, but they are always exactly where you were about to land.`,
 `Throw the wrench upward or diagonally to swat them.`),
E('e_turret','enemy','TURRET','ENEMY - GUN EMPLACEMENT',['e','t'],['HEALTH: 3 HITS','STOMP: YES','FIRST SEEN: 1-4'],
 `A stationary gun that turns to face you and fires sparks across the room. It won't chase you, but it never stops watching. Solid cover blocks its shots, and the wrench can knock sparks out of the air before they reach you.`,
 `Take cover, then rush in and hit it 3 times.`),
E('e_grab','enemy','GRABBER','ENEMY - CEILING CLAW',['e','g'],['HEALTH: 2 HITS','STOMP: NO','FIRST SEEN: 1-6'],
 `A claw hanging from the ceiling on a long cable. When someone walks beneath it, it shakes, then drops like a stone. Afterward it rewinds slowly and waits for its next customer.`,
 `The shake is your warning. Run past it, or hit it with the wrench.`),
E('e_crush','enemy','CRUSHER','ENEMY - HYDRAULIC PRESS',['e','C'],['HEALTH: INDESTRUCTIBLE','STOMP: NO','FIRST SEEN: 1-5'],
 `A massive press that slams down on a timer. It has no brain and no weak point, and it cannot be reasoned with. Crushers can't be destroyed, only outsmarted: after every slam they rise slowly, and that gap is all the time you need.`,
 `Wait for it to rise, then run through.`),
E('e_sec','enemy','SECURITY BOT','ENEMY - PATROL UNIT',['e','c'],['HEALTH: 1 HIT','STOMP: YES','FIRST SEEN: 2-1'],
 `A white patrol bot with a cyan visor. It strolls its route calmly until it spots you on its level, then the visor turns red and it charges at over three times its walking speed. Security Bots are very polite right up until they aren't.`,
 `Stay out of its line of sight, or stomp it as it comes.`),
E('e_laser','enemy','LASER EYE','ENEMY - CEILING CAMERA',['e','l'],['HEALTH: INDESTRUCTIBLE','STOMP: NO','FIRST SEEN: 2-2'],
 `A security camera with ideas. Laser Eyes cycle on a timer: dark, then a flickering warning light, then a beam that reaches all the way to the floor. They can't be destroyed, but they are extremely predictable.`,
 `When the light flickers the beam is coming. Wait for it to clear, then run.`),
E('e_mace','enemy','MACE','ENEMY - SWINGING HAZARD',['e','q'],['HEALTH: INDESTRUCTIBLE','STOMP: NO','FIRST SEEN: 2-5'],
 `A spiked iron ball on a chain, swinging in a circle around a fixed point. It never slows down and it never gets tired, but its loop never changes, either. Learn the rhythm and it's just a very rude metronome.`,
 `Jump over it or time your run around its swing.`),
E('e_drip','enemy','DRIPPER','ENEMY - LEAKY PIPE',['e','a'],['HEALTH: INDESTRUCTIBLE','STOMP: NO','FIRST SEEN: 2-6'],
 `A ceiling pipe with a grudge. A green bulge swells at its tip, and a moment later a drop of acid falls straight down. Drippers are built into the ceiling and can't be broken, but the drops they release can be swatted away.`,
 `Watch the bulge grow, then move out from under it. The wrench stops drops.`),
E('e_slug','enemy','SLAG SLUG','ENEMY - MOLTEN CRAWLER',['e','m'],['HEALTH: 2 HITS','STOMP: ONLY WHEN COOL','FIRST SEEN: 4-1'],
 `A blob of molten slag that oozes along the boiler floor. While it glows red it is far too hot to stomp. One hit from the wrench cools its crust to grey stone, and after that it can be stomped like anything else.`,
 `Wrench first, then stomp. Or just walk around it, it is slow.`),
E('e_bat','enemy','CINDER BAT','ENEMY - EMBER FLIER',['e','v'],['HEALTH: 1 HIT','STOMP: YES','FIRST SEEN: 4-1'],
 `A scorched robot bat that hangs from ceiling beams with its wings folded. Walk beneath one and it shudders, picks your spot, then dives straight at it. After the dive it flaps back up to its perch and waits again.`,
 `Let it dive and miss, then hit it on the way back. Or stomp it.`),
E('e_stoker','enemy','STOKER','ENEMY - FURNACE WORKER',['e','Q'],['HEALTH: 2 HITS','STOMP: YES','FIRST SEEN: 4-1'],
 `A furnace hand with a shovel and a never-ending supply of hot coal. It faces TJ and lobs glowing coals in a high arc, aimed at wherever TJ is standing. Lobbed coals can be batted out of the air by the wrench.`,
 `Keep moving. The coal lands where you were, not where you're going.`),
E('e_cart','enemy','COAL CART','ENEMY - RUNAWAY CART',['e','x'],['HEALTH: 2 HITS','STOMP: YES','FIRST SEEN: 4-2'],
 `A heavy cart heaped with burning coal that putters back and forth along its floor. The moment TJ steps into its line of sight it shudders, revs up, and barrels forward at full speed until it hits a wall or runs out of floor. After that it skids to a stop and dazes for a moment.`,
 `Jump over the charge, or stomp it while it's stunned.`),
E('e_hopper','enemy','STEAM HOPPER','ENEMY - BOILER BOT',['e','h'],['HEALTH: 2 HITS','STOMP: YES','FIRST SEEN: 4-2'],
 `A pressure tank on little legs that hops toward TJ. A wisp of steam hisses from its valve just before each hop, and every time it lands it vents two puffs of scalding steam along the floor, one to each side. The wrench can swat a puff out of the air.`,
 `Stay out of the floor level when it lands. Jump the puffs.`),
E('e_leaper','enemy','MAGMA LEAPER','ENEMY - FIRE HAZARD',['e','T'],['HEALTH: INDESTRUCTIBLE','STOMP: NO','FIRST SEEN: 4-3'],
 `A fireball with a face that lurks in pools of fire. Sparks bubble up from its pit for a moment, then it launches itself up high and drops back in. It can't be hurt, and it can't be stomped. It leaves once it hits the fire.`,
 `Watch for the bubbling sparks, and cross while it's down.`),
/* ---- BOSSES ---- */
E('b_sil','boss','SILVERHAX','BOSS - WORLD 1',['boss','X'],['HEALTH: 12 HITS','WEAK TO: WRENCH','OPEN: WHEN SYSTEM LAGS'],
 `Silverhax types commands into his terminals to synthesize an attack, and announces it on the readout at the top of the screen: SPARKS rain down from above, GEARS roll in along the floor, LASER sweeps the entire floor at once, and DRONES arrive in pairs. He works faster once he's down to half health.`,
 `After each attack his system LAGS. Hit him then. Get on a platform for the laser.`),
E('b_oro','boss','OROSPIN','BOSS - WORLD 2',['boss','O'],['HEALTH: 16 HITS','WEAK TO: WRENCH','OPEN: WHEN DIZZY'],
 `OroSpin circles the arena along the floor, walls and ceiling. He has four attacks: a SPIN LAP around the whole room, a CEILING DROP onto your position, a WALL BARRAGE of shots, and a bouncing RICOCHET. He gets faster at 10 and again at 5 health, and he's dangerous to touch at all times, except when he's dizzy.`,
 `Only hit him when he's dizzy. His attack name shows on screen.`),
E('b_bono','boss','BONOBOMB','BOSS - WORLD 3',['bono'],['HEALTH: 14 HITS','WEAK TO: WRENCH','OPEN: WHEN WINDED'],
 `Bonobomb darts around the arena faster than any guard before him. He lobs bombs at where TJ is standing, dashes the length of the floor leaving a trail of them, and leaps up to bomb from the air. Every attack leaves him out of breath, and that is the opening. Below half health he stops pausing between tricks.`,
 `Watch the floor markers: they show where bombs will land. The wrench can defuse a bomb, and the catwalks are out of reach of the blasts. Hit him while he is winded.`),
E('b_bernie','boss','BERNIE ZEE','BOSS - WORLD 4',['bernie'],['HEALTH: 20 HITS','WEAK TO: WRENCH','OPEN: WHILE STOKING'],
 `Bernie Zee turns fire into weapons. He tosses glowing ingots that burn on the floor, slams his hammer down to send shockwaves along the ground, and forges anvils that crash down from above. Every attack burns coal, and after three he has to leap up to one of the two furnaces and stoke it. While he shovels he cannot defend himself. Below half health he forges faster and in bigger batches.`,
 `Red markers show where ingots and anvils will land. Puddles burn out, so keep moving. The catwalks are safe from hammer shockwaves, and that is also where the furnaces are. He always stokes the furnace farthest from you, so climb up and hit him.`),
E('c_holo','char','HOLOSECURITY TYPE X','CHARACTER - SECURITY SYSTEM',['holo'],['TYPE: SECURITY SYSTEM','BODY: GEAR AND TEAL CORE','BOSS: PENULTIMATE'],
 `The factory's last line of defense, a security system shaped like a gear with a teal crystal turning in its center. It has no arms and no legs, and it does not need them. Type X records everything it has ever seen, including every guard TJ beat on the way here, and it can play those recordings back as solid light.`),
E('b_holo','boss','HOLOSECURITY TYPE X','BOSS - WORLD 5',['holo'],['HEALTH: 4 HITS','WEAK TO: ITS HOLOGRAMS','OPEN: NEVER DIRECTLY'],
 `Holosecurity Type X never fights for itself. It projects teal holograms of the four guardians TJ already defeated, Silverhax, OroSpin, Bonobomb and Bernie Zee, one at a time, each with only two hit points. Every hologram that falls costs the gear one of its four. Nothing else can hurt it. After the second hologram it also drops spikes of light on you.`,
 `Each hologram uses the real boss's attacks, so wait for the same openings as before. Two hits is all it takes, and later holograms act as if they were closer to defeat, so they are quicker.`),
E('c_simian','char','MISTER SIMIAN','CHARACTER - THE MANAGER',['simian'],['SPECIES: GORILLA','JOB: FACTORY MANAGER','FAVORITE WORD: EFFICIENCY'],
 `A real gorilla in a blue suit and a very good tie, and the manager of the whole factory. Mister Simian is proud of his workforce, and especially proud of how little it costs. The robots were his idea. He believes every problem is a spreadsheet and every worker is a line on it, and he has just noticed that TJ is a line that will not add up.`),
E('b_simian','boss','MISTER SIMIAN','BOSS - WORLD 5 - FINAL',['simian'],['HEALTH: 30 HITS','WEAK TO: WRENCH','OPEN: WHEN WINDED'],
 `Mister Simian fights the way he manages: loudly, and with other people's property. He lobs briefcases that burst into burning paper, charges and pounds the floor, drops steel girders from above and beats his chest to send out rings of sparks. Every attack tires him out. As he loses patience he flies into a rage, and his attacks come faster and in bigger batches.`,
 `Briefcase fires burn out, so keep moving. Girders show a red marker first. The catwalks are safe from floor shockwaves but not from girders. He is only vulnerable when winded, so survive one attack and then hit him with everything.`),
/* ---- WORLDS ---- */
E('w1','world','ASSEMBLY LINE','WORLD 1',['w',1],['7 STAGES','BOSS: SILVERHAX','THEME: HEAVY MACHINERY'],
 `Where the robots are built, one bolt at a time. Conveyors, lifts and turret-lined halls snake through the loading docks, and the machines never stop. A fine place to learn the basics, as long as the basics don't learn you first.`,null,STG(0,7)),
E('w2','world','QUALITY ASSURANCE','WORLD 2',['w',2],['7 STAGES','BOSS: OROSPIN','THEME: SPOTLESS LABS'],
 `Every robot passes through here before joining the workforce. The labs are spotless and sterile, packed with acid baths, laser grids, shattering glass and vault doors that open for those who know where to hit them. TJ is fairly sure he wouldn't pass inspection.`,null,STG(7,14)),
E('w3','world','WAY AROUND','WORLD 3',['w',3],['7 STAGES','BOSS: BONOBOMB','THEME: THE GREAT OUTDOORS'],
 `The factory's outer grounds. The direct route is closed, so TJ is taking a detour around the outside, past scrapyards, railyards and scaffold towers on the way to the next area. Every old hazard turns up again out here, just meaner and in worse company. At least there is sky.`,null,'STAGES: '+SN.slice(14,21).join(', ')),
E('w4','world','BOILER','WORLD 4',['w',4],['7 STAGES','BOSS: BERNIE ZEE','THEME: FURNACES AND HEAT'],
 `The factory's basement, where all that power comes from. Dark iron, open fire and scorching pipes, with a heat that keeps climbing the longer you stay. Cooler machines are the only relief. Everything down here is built to be tough, and so are the workers.`,null,'STAGES: '+SN.slice(21,28).join(', ')),
/* ---- MECHANICS ---- */
E('manual','mech','THE MANUAL','MECHANIC - THIS BOOK',['book'],['OPEN: M ON TITLE SCREEN','SAVED: ALWAYS','FILLS IN: AS YOU PLAY'],
 `This book. Its pages fill in as you meet new people, machines and hazards in the factory, so it's the one thing the factory can't take from you. Your progress through the stages is not saved, but the manual always is.`),
E('m_move','mech','RUN AND JUMP','MECHANIC - MOVEMENT',['tj','air'],['MOVE: ARROWS OR WASD','JUMP: Z, SPACE OR K','HOLD: HIGHER JUMP'],
 `Hold jump to go higher, or tap it for a short hop. You can steer in the air, and a running start gives you long leaps. TJ can still jump for a split second after running off a ledge, and a jump pressed just before landing will be remembered.`,
 `Build up speed before big gaps.`),
E('m_wrench','mech','THE WRENCH','MECHANIC - WEAPON',['wr'],['THROW: X, J OR SHIFT','RETURNS: LIKE BOOMERANG','ONE AT A TIME'],
 `TJ throws the wrench, it flies out, slows, and then returns to his hand, hitting everything along the way in both directions. It breaks crates, flips switches, damages enemies and knocks enemy shots out of the air. TJ can't throw again until it's back.`,
 `The icon in the top right dims while it's away.`),
E('m_aim','mech','AIMING','MECHANIC - WRENCH',['aim'],['UP+X: STRAIGHT UP','UP+DIR+X: DIAGONAL UP','AIR DOWN+DIR+X: DOWN'],
 `The wrench doesn't have to go forward. Hold Up while throwing to send it straight up, add a direction for a diagonal, or throw diagonally downward while in mid-air. Great for drones, turrets on high ledges and anything above TJ's head.`,
 `Aim at things you can't reach by jumping.`),
E('m_stomp','mech','STOMPING','MECHANIC - COMBAT',['stomp'],['LAND ON: ENEMY HEADS','BOUNCE: HOLD JUMP','SPIKES: NO'],
 `Land on top of an enemy to hit it and bounce off. Hold jump during the bounce for extra height. A stomp does the same damage as a wrench hit, so tougher enemies need several. Anything covered in spikes will hurt you instead.`,
 `Chain bounces across a row of enemies.`),
E('m_bolt','mech','BOLTS','MECHANIC - COLLECTIBLE',['bolt'],['100 BOLTS: EXTRA LIFE','FROM: ROBOTS, CRATES','COUNTED: PER STAGE'],
 `Gold bolts are scattered all over the factory. Collect 100 for an extra life. Defeated robots sometimes drop one, and the end of each stage tallies how many you found out of the total.`,
 `The wrench can grab bolts you can't reach.`),
E('m_hp','mech','HEALTH AND LIVES','MECHANIC - SURVIVAL',['hp'],['HEALTH: 4 POINTS','START LIVES: 3','EXTRA LIFE: 100 BOLTS'],
 `TJ has 4 hit points, shown as red bars in the top left. A hit makes him flash and become briefly invincible. Lose all four, or fall into a pit, and you lose a life. Run out of lives and the run is over.`,
 `Green health crates restore 2 points.`),
E('m_run','mech','THE RUN','MECHANIC - NO SAVES',['run'],['PROGRESS: NOT SAVED','GAME OVER: NEW RUN','MANUAL: ALWAYS SAVED'],
 `This is one continuous run. Stage progress is never saved: if you run out of lives, it's back to the title screen and a fresh start from the beginning. Checkpoint flags only last as long as the run does. Only the pages of this manual carry over.`,
 `Every run is a chance to find a new page.`),
E('m_bcrate','mech','BOLT CRATES','MECHANIC - CONTAINER',['tile','B'],['BREAK WITH: WRENCH','CONTAINS: 3 BOLTS','FIRST SEEN: 1-1'],
 `Wooden crates stamped with cross-bracing. Hit one with the wrench to smash it and spill three bolts. They count toward the stage's bolt total, so they're worth looking for, and some are tucked into odd places.`,
 `Jumping on them does nothing. Throw the wrench.`),
E('m_hcrate','mech','HEALTH CRATES','MECHANIC - CONTAINER',['tile','H'],['BREAK WITH: WRENCH','RESTORES: 2 HEALTH','FIRST SEEN: 1-1'],
 `Green crates with a white cross. Smash one with the wrench and a health pickup pops out, restoring 2 hit points. If you're at full health, the pickup stays put, so you can come back for it.`,
 `Save them for when you're hurt.`),
E('m_cat','mech','CATWALKS','MECHANIC - PLATFORM',['tile','=',2],['JUMP UP: PASSES THROUGH','DOWN+JUMP: DROP THROUGH','FIRST SEEN: 1-1'],
 `Thin metal platforms that you can jump up through from below. Stand on one and press Down plus Jump to drop through. Falling onto one from above is always safe, so they make good stepping stones up a long shaft.`,
 `Down plus jump is also a handy escape.`),
E('m_check','mech','CHECKPOINTS','MECHANIC - FLAG',['flag'],['TOUCH: FLAG TURNS GREEN','LOSE A LIFE: RESTART THERE','RESETS EACH STAGE'],
 `A red flag on a pole. Walk past it and it turns green. If you lose a life, TJ restarts from the last flag you touched instead of the beginning of the stage. Flags reset when you move on to the next stage.`),
E('m_exit','mech','EXIT DOORS','MECHANIC - GOAL',['exit'],['REACH IT: STAGE CLEAR','BOLTS TALLIED AT END','NO TIME LIMIT'],
 `The way forward. Reach the glowing EXIT door at the end of a stage to clear it and move on. Your bolt count for the stage is tallied on the clear screen. There's no timer, so take your time.`),
E('m_sign','mech','SIGNS','MECHANIC - HINTS',['sign'],['READ: STAND NEAR ONE','APPEAR: WHERE USEFUL'],
 `Yellow signs posted around the factory with advice for newcomers. Stand near one to read it. TJ has no idea who put them there, but so far every one of them has been right.`),
E('m_conv','mech','CONVEYORS','MECHANIC - TERRAIN',['tile','>'],['PUSH: ARROW DIRECTION','SOME ARE PLATFORMS','FIRST SEEN: 1-2'],
 `Belts that carry anything standing on them in the direction of their arrows. Run with a belt to go faster, or against it and you'll have to keep running just to hold your ground. Some belts are floating platforms that keep moving, so keep jumping.`),
E('m_spike','mech','SPIKES','MECHANIC - HAZARD',['tile','^'],['DAMAGE: 1 HEALTH','KNOCKS YOU UP','FIRST SEEN: 1-1'],
 `Sharp metal spikes set into the floor. Touching them costs a health point and launches TJ into the air. They can't be broken, only jumped.`,
 `Hold jump for a longer leap over them.`),
E('m_acid','mech','ACID','MECHANIC - HAZARD',['tile','V'],['DAMAGE: 1 HEALTH','KNOCKS YOU UP','FIRST SEEN: 2-1'],
 `Green acid pools in the labs. It's not for swimming: touching it hurts and bounces TJ right back out. Cross it fast, because there's no safe way to stand in it.`,
 `Look for platforms and springs over the top.`),
E('m_spring','mech','SPRINGS','MECHANIC - TERRAIN',['tile','U'],['STEP ON: HIGH LAUNCH','STEER: HOLD LEFT/RIGHT','FIRST SEEN: 2-1'],
 `Red coil pads that fling TJ high into the air when he steps on them. Hold left or right while airborne to steer, and you can reach platforms far above. They tend to show up wherever a normal jump isn't enough.`),
E('m_glass','mech','GLASS PANELS','MECHANIC - PLATFORM',['tile','F',2],['CRACKS: AFTER YOU STAND','BREAKS: SOON AFTER','REBUILDS: LATER'],
 `Pale glass floors. They look sturdy, but they start to rattle moments after TJ stands on one, then break away. Panels next to it crack too. They rebuild themselves a few seconds later, and you can drop through them like catwalks.`,
 `Keep moving. Don't stop on glass.`),
E('m_switch','mech','SWITCHES','MECHANIC - CONTROL',['tile','S'],['HIT WITH: WRENCH','LIGHT: RED TO GREEN','FIRST SEEN: 2-4'],
 `A control box with a red light. Hit it with the wrench and the light turns green, opening every security door in the stage for about eight seconds. The wrench can reach switches from a distance.`,
 `Throw it from afar. You don't need to stand next to one.`),
E('m_door','mech','SECURITY DOORS','MECHANIC - BARRIER',['tile','D'],['OPENS: BY A SWITCH','STAYS OPEN: ABOUT 8 SEC','FIRST SEEN: 2-4'],
 `Red barred doors that block the way. They can't be broken, but they open for several seconds when a switch is hit. If the timer runs out while you're standing in the doorway, the door holds open until you step out.`,
 `Hit the switch, then run for it.`),
E('m_draft','mech','UPDRAFTS','MECHANIC - TERRAIN',['tile','A',4],['EFFECT: LIFTS YOU','STEER: FREELY IN AIR','FIRST SEEN: 2-5'],
 `Columns of rising air blown up through vents, shown as faint shimmering streaks. Step in and TJ is carried upward, and he can steer freely while floating. Ride one to reach high platforms, and watch what's waiting for you up there.`),
E('m_fire','mech','OPEN FIRE','MECHANIC - HAZARD',['tile','f'],['DAMAGE: 1 HEALTH','HEATS YOU UP','FIRST SEEN: 4-1'],
 `Flames licking up from the floor. Touching them hurts and knocks TJ back, and standing near one makes the heat meter climb faster. They never go out, so jump over them or find another way around.`,
 `Fire can't be stopped by the wrench. Jump it.`),
E('m_burner','mech','BURNERS','MECHANIC - HAZARD',['e','n'],['DAMAGE: 1 HEALTH','CYCLE: WARN, BLAST, REST','FIRST SEEN: 4-1'],
 `Floor vents that spit a tall column of flame on a timer. A small flicker warns you first, then the full blast fires for a couple of seconds, then it rests. The column is taller than TJ can jump, so don't try to leap it. A solid ceiling stops the flames.`,
 `Wait for the blast to end, then run. They hit the heat meter too.`),
E('m_heat','mech','HEAT','MECHANIC - METER',['heat'],['SHOWN: BESIDE YOUR LIVES','RISES: FASTER NEAR FIRE','FULL: LOSE HEALTH'],
 `In the boiler the air itself is a hazard. The HEAT meter creeps up the whole time you're in a hot stage, and rises faster near fire and burner flames. The screen glows redder as it fills. At full heat TJ loses health every second or so until he cools off.`,
 `Look for cooler machines before the meter fills.`),
E('m_cool','mech','COOLERS','MECHANIC - MACHINE',['tile','z'],['EFFECT: DRAINS HEAT FAST','USE: STAND NEAR IT','FIRST SEEN: 4-1'],
 `Humming refrigeration units with a spinning fan and a frosty window. Stand close to one and the heat meter drains away in a second or two. They are never required, but they're often tucked in a safe spot just before somewhere hot.`,
 `Top up whenever you pass one.`),
E('m_ladder','mech','LADDERS','MECHANIC - TERRAIN',['lad'],['CLIMB: UP OR DOWN','LET GO: JUMP OR STEP OFF','FIRST SEEN: 4-1'],
 `Steel ladders that connect the boiler's levels. Press up to grab one and climb, down to climb back. Jump to leap off, or push left or right to step away. You can still throw the wrench while hanging on. Stand on a ladder's top and press down to climb back down.`,
 `Some walls are too tall to jump. Look for the ladder.`),
E('m_beep','mech','BEEP BLOCKS','MECHANIC - TERRAIN',['beep'],['COLORS: BLUE AND PINK','SWITCH: EVERY FEW SECONDS','WARNING: FOUR BEEPS'],
 `Blocks in two colors that take turns. Only one color is solid at a time, and the other is a faint outline you can walk straight through. Four beeps warn that the colors are about to swap, and the color that's about to turn solid flashes. If you're standing inside a block that is about to go solid, the switch waits for you to get out.`,
 `Jump on the last beep and the swap will catch you mid-air.`),
E('m_tram','mech','SKY TRAMS','MECHANIC - PLATFORM',['tram'],['RIDES: BACK AND FORTH','PAUSES: AT EACH END','FIRST SEEN: 5-1'],
 `Little maintenance cars that shuttle along a rail high above the factory. They stop for a moment at each end, then roll back the other way, carrying anything that stands on them. You can jump up onto one from below, and it takes you along for the ride. Step on as it arrives and hop off before it turns around.`,
 `It does not wait long at the far end.`),
